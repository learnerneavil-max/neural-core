<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural_Link // Uplink v2.1 (Expanded)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>NEURAL_LINK // UPLINK</h1>
            <div class="hub">
                <p>STATUS:</p>
                <div id="statusLog"></div>
            </div>
            <div class="stats">
                <p>POWER: <span id="powerVal">--</span> / BREACH SCORE: <span id="scoreVal">--</span></p>
            </div>
        </header>

        <!-- Use slightly larger dimensions for complex levels -->
        <canvas id="gameCanvas" width="400" height="500"></canvas>

        <div class="controls">
            <button id="resetBtn">RESET_SYSTEM()</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
